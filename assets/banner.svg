<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="StudyBuddy research compendium, Part IV Project 133. Part 1, the platform, by Moksh Manglani: admin and facilitator. Part 2, learner insights, by May Thazin: facilitator and students." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#2f4a6d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <g text-anchor="middle">
    <text x="640" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#ffffff">StudyBuddy · Research Compendium</text>
    <text x="640" y="102" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.8">Making Education More Accessible and Reliable: AI-Driven Facilitator-Based Teaching</text>
  </g>

  <!-- Two equal halves -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <!-- Part 1 -->
    <rect x="64" y="132" width="560" height="200" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <text x="96" y="168" font-size="14" letter-spacing="2" fill-opacity="0.6">PART 1 · THE PLATFORM</text>
    <text x="96" y="198" font-size="24" font-weight="700">Moksh Manglani</text>
    <rect x="96" y="222" width="150" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="171" y="250" font-size="17" text-anchor="middle">Admin</text>
    <line x1="256" y1="244" x2="402" y2="244" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="412" y="222" width="180" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="502" y="250" font-size="17" text-anchor="middle">Facilitator</text>
    <text x="96" y="300" font-size="15" fill-opacity="0.78">Admins design lessons and approve facilitators;</text>
    <text x="96" y="320" font-size="15" fill-opacity="0.78">facilitators walk through and deliver them as designed</text>

    <!-- Part 2 -->
    <rect x="656" y="132" width="560" height="200" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <text x="688" y="168" font-size="14" letter-spacing="2" fill-opacity="0.6">PART 2 · STUDENT LEARNING INSIGHTS</text>
    <text x="688" y="198" font-size="24" font-weight="700">May Thazin</text>
    <rect x="688" y="222" width="180" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="778" y="250" font-size="17" text-anchor="middle">Facilitator</text>
    <line x1="878" y1="244" x2="1024" y2="244" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="1034" y="222" width="150" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="1109" y="250" font-size="17" text-anchor="middle">Students</text>
    <text x="688" y="300" font-size="15" fill-opacity="0.78">Learner interactions become evidence-linked insights,</text>
    <text x="688" y="320" font-size="15" fill-opacity="0.78">so facilitators can see who needs support and what to do</text>
  </g>

  <!-- Footer -->
  <text x="640" y="374" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.62">Part IV Project #133  ·  SOFTENG 700A/B  ·  University of Auckland  ·  2026  ·  Supervised by Professor Gill Dobbie</text>
</svg>
